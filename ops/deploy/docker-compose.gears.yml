version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: agency-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://127.0.0.1:5678/
      - GENERIC_TIMEZONE=Africa/Cairo
      # Pinned, not auto-generated: n8n invents one on first boot and stores it
      # in the volume, so a recreated volume silently orphans every credential
      # n8n has saved (channel accounts included). Failing loud beats that.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # The Tool Bridge bearer token, so the workflow verifies its caller
      # instead of assuming anything on loopback is the engine.
      - AGENCY_BRIDGE_TOKEN=${AGENCY_BRIDGE_TOKEN:?set AGENCY_BRIDGE_TOKEN in .env}
      # The editor is served over plain http on loopback, so a Secure cookie
      # would never come back and the login would loop forever.
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n

  evolution-db:
    image: postgres:15-alpine
    container_name: agency-evolution-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=evolution_db
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_pass_2026
    volumes:
      - evolution_db_data:/var/lib/postgresql/data

  evolution-redis:
    image: redis:alpine
    container_name: agency-evolution-redis
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: agency-evolution-api
    restart: unless-stopped
    depends_on:
      - evolution-db
      - evolution-redis
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      - SERVER_NAME=agency-evolution
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8085
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-evolution_secret_key_2026}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_pass_2026@evolution-db:5432/evolution_db?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/1
  directus:
    image: directus/directus:latest
    container_name: agency-directus
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:8055"
    environment:
      - KEY=413b5e4a-58f3-42e1-9562-b9cf6815ec11
      - SECRET=7b91d293-4927-4c74-9f27-a065db720f18
      - ADMIN_EMAIL=${DIRECTUS_ADMIN_EMAIL:-admin@agency.local}
      - ADMIN_PASSWORD=${DIRECTUS_ADMIN_PASSWORD:-admin_secret_2026}
      - PUBLIC_URL=${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      - CORS_ENABLED=true
      - CORS_ORIGIN=*
      - WEBSOCKETS_ENABLED=true
      - DB_CLIENT=sqlite3
      - DB_FILENAME=/directus/database/data.db
    volumes:
      - directus_database:/directus/database
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions

volumes:
  n8n_data:
  evolution_db_data:
  evolution_instances:
  directus_database:
  directus_uploads:
  directus_extensions:
